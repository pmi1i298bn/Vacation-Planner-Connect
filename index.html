<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Connect Vacation Planning</title>
    <style>
      :root { font-family: ui-rounded, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; background: #f4f2ec; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
      main { width: min(480px, calc(100vw - 40px)); background: white; border-radius: 24px; padding: 32px; box-shadow: 0 24px 70px #1720331f; }
      .icon { width: 56px; height: 56px; display: grid; place-items: center; border-radius: 18px; color: white; background: linear-gradient(135deg, #5b5fef, #8a68d5); font-size: 26px; }
      h1 { margin: 20px 0 8px; }
      p { color: #586174; line-height: 1.5; }
      label { display: block; margin: 18px 0 6px; font-weight: 650; }
      input { box-sizing: border-box; width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ccd0d9; font: inherit; }
      .buttons { display: flex; gap: 10px; margin-top: 22px; } [hidden] { display: none !important; }
      button { flex: 1; padding: 12px; border: 0; border-radius: 11px; font: inherit; font-weight: 700; cursor: pointer; }
      .primary { color: white; background: #5b5fef; }
      .secondary { color: #343b4c; background: #eceef4; }
      #status { min-height: 24px; font-size: 14px; color: #7d3d00; }
      ul { color: #343b4c; padding-left: 22px; }
    </style>
  </head>
  <body>
    <main>
      <div class="icon">✈︎</div>
      <h1>Connect Vacation Planning</h1>
      <p id="request">ChatGPT is requesting permission to connect.</p>
      <ul><li>Read trips, constraints, bookings, and planning status</li><li>Create or update confirmed travel plans</li><li>Record revisions so changes remain reviewable</li></ul>
      <div id="signin">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com" />
        <button class="primary" id="magic" style="margin-top: 12px; width: 100%">Email me a sign-in link</button>
      </div>
      <div class="buttons" id="consent" hidden>
        <button class="secondary" id="deny">Deny</button>
        <button class="primary" id="approve">Allow</button>
      </div>
      <p id="status"></p>
    </main>
    <script type="module">
      import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
      import { configuration } from './config.js'
      const supabase = createClient(configuration.supabaseUrl, configuration.supabasePublishableKey)
      const parameters = new URLSearchParams(location.search)
      const authorizationId = parameters.get('authorization_id')
      const status = document.querySelector('#status')
      const signin = document.querySelector('#signin')
      const consent = document.querySelector('#consent')
      const request = document.querySelector('#request')

      const code = parameters.get('code')
      if (code) {
        const { error } = await supabase.auth.exchangeCodeForSession(code)
        if (error) status.textContent = error.message
      }

      async function refresh() {
        const { data: { session } } = await supabase.auth.getSession()
        signin.hidden = Boolean(session)
        consent.hidden = !session || !authorizationId
        if (!authorizationId) {
          status.textContent = 'This page must be opened from the ChatGPT connection flow.'
          return
        }
        if (session) {
          const { data, error } = await supabase.auth.oauth.getAuthorizationDetails(authorizationId)
          if (error) status.textContent = error.message
          if (data) { if (data.redirect_url) { location.assign(data.redirect_url); return }
            const clientName = data.client?.name ?? 'ChatGPT'
            const scopes = data.scope ? ` Requested access: ${data.scope.split(' ').join(', ')}.` : ''
            request.textContent = `${clientName} is requesting permission to connect.${scopes}`
          }
        }
      }
      document.querySelector('#magic').onclick = async () => {
        status.textContent = 'Sending…'
        const email = document.querySelector('#email').value.trim()
        const redirectTo = `${location.origin}${location.pathname}?authorization_id=${encodeURIComponent(authorizationId ?? '')}`
        const { error } = await supabase.auth.signInWithOtp({ email, options: { emailRedirectTo: redirectTo } })
        status.textContent = error ? error.message : 'Check your email, then return here.'
      }
      document.querySelector('#approve').onclick = async () => {
        const { data, error } = await supabase.auth.oauth.approveAuthorization(authorizationId)
        if (error) return status.textContent = error.message
        location.assign(data.redirect_url)
      }
      document.querySelector('#deny').onclick = async () => {
        const { data, error } = await supabase.auth.oauth.denyAuthorization(authorizationId)
        if (error) return status.textContent = error.message
        location.assign(data.redirect_url)
      }
      await refresh()
    </script>
  </body>
</html>
